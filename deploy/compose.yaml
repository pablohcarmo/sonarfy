name: sonarfy
services:
  backend:
    image: sonarfy-backend:${SONARFY_IMAGE_TAG:-local}
    build:
      context: ..
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/application.properties:/config/application.properties:ro
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  db:
    image: postgres:17.9
    restart: unless-stopped
    mem_limit: 128m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]
    environment:
      POSTGRES_DB: sonarfy
      POSTGRES_USER: sonarfy
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/tables.sql:/docker-entrypoint-initdb.d/01_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarfy -d sonarfy"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres_data:
secrets:
  db_password:
    file: ./config/db_password
