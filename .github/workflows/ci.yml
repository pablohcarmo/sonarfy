name: Java CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sonarfy_ci
          POSTGRES_USER: sonarfy_ci
          POSTGRES_PASSWORD: isolated-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sonarfy_ci -d sonarfy_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Execute automated tests
        run: ./mvnw test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Postman CLI
        run: npm install --global postman-cli@1.85.0

      - name: Execute location HTTP tests with GeoNames simulation
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          simulation_log="$RUNNER_TEMP/geonames-simulation.log"
          setsid postman simulation run test-support/location.sim.yaml --port 55441 --no-history --output ndjson > "$simulation_log" 2>&1 &
          simulation_pid=$!
          trap 'kill -- -"$simulation_pid" 2>/dev/null || true; wait "$simulation_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if ! kill -0 "$simulation_pid" 2>/dev/null; then
              cat "$simulation_log"
              exit 1
            fi
            if curl --fail --silent --max-time 1 'http://127.0.0.1:55441/geonames/searchJSON?name_startsWith=Camp&maxRows=10&featureClass=P&orderby=population&lang=pt&username=test-only' > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$simulation_log"
            exit 1
          fi
          ./mvnw test -Dtest=LocationIntegrationTest -Dsonarfy.test.location=true

      - name: Validate versioned schema and Spotify migration in disposable PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER" psql -U sonarfy_ci -d sonarfy_ci -v ON_ERROR_STOP=1 < db/tables.sql
          # Only this disposable CI database: simulate the schema before the Spotify table.
          docker exec "$POSTGRES_CONTAINER" psql -U sonarfy_ci -d sonarfy_ci -v ON_ERROR_STOP=1 -c 'DROP TABLE spotify_connection'
          docker exec -i "$POSTGRES_CONTAINER" psql -U sonarfy_ci -d sonarfy_ci -v ON_ERROR_STOP=1 < db/migrations/001_create_spotify_connection.sql
          docker exec "$POSTGRES_CONTAINER" psql -U sonarfy_ci -d sonarfy_ci -v ON_ERROR_STOP=1 -c 'ALTER TABLE users DROP COLUMN spotify_authorization_version'
          docker exec -i "$POSTGRES_CONTAINER" psql -U sonarfy_ci -d sonarfy_ci -v ON_ERROR_STOP=1 < db/migrations/002_add_spotify_authorization_version.sql
          # Simulate the schema before refresh tokens and apply the incremental migration.
          docker exec "$POSTGRES_CONTAINER" psql -U sonarfy_ci -d sonarfy_ci -v ON_ERROR_STOP=1 -c 'DROP TABLE refresh_tokens'
          docker exec -i "$POSTGRES_CONTAINER" psql -U sonarfy_ci -d sonarfy_ci -v ON_ERROR_STOP=1 < db/migrations/003_create_refresh_tokens.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U sonarfy_ci -d sonarfy_ci -v ON_ERROR_STOP=1 < db/migrations/004_add_refresh_token_sessions.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U sonarfy_ci -d sonarfy_ci -v ON_ERROR_STOP=1 < db/migrations/005_add_refresh_token_remember_me.sql

      - name: Execute PostgreSQL persistence and concurrency tests
        env:
          SONARFY_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/sonarfy_ci
          SONARFY_TEST_DB_USER: sonarfy_ci
          SONARFY_TEST_DB_PASSWORD: isolated-ci-password
        run: ./mvnw test -Dtest=ExistingSchemaIntegrationTest,RefreshTokenPostgresTest,PasswordResetPostgresTest -Dsonarfy.test.existing-schema=true

      - name: Validate email change migration and concurrency tests
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          SONARFY_TEST_DB_USER: sonarfy_ci
          SONARFY_TEST_DB_PASSWORD: isolated-ci-password
          SONARFY_EMAIL_CHANGE_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/sonarfy_email_change_validation
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U sonarfy_ci sonarfy_email_change_validation
          docker exec -i "$POSTGRES_CONTAINER" psql -U sonarfy_ci -d sonarfy_email_change_validation -v ON_ERROR_STOP=1 < db/tables.sql
          docker exec "$POSTGRES_CONTAINER" psql -U sonarfy_ci -d sonarfy_email_change_validation -v ON_ERROR_STOP=1 -c 'DROP TABLE email_change_mail_outbox, email_change_requests'
          docker exec -i "$POSTGRES_CONTAINER" psql -U sonarfy_ci -d sonarfy_email_change_validation -v ON_ERROR_STOP=1 < db/migrations/006_create_email_change_requests.sql
          ./mvnw test -Dtest=EmailChangePersistencePostgresTest,EmailChangeRequestPostgresTest,EmailChangeConfirmationPostgresTest -Dsonarfy.test.email-change-postgres=true
