simulation: spotify-recently-played
generated: '2026-11-21'
purpose:
  stands_in_for: Spotify recent plays, album metadata and OAuth Client Credentials with synthetic responses and error scenarios
  unblocks: HTTP client serialization, timeout, pagination and sanitized error handling without real credentials
assumptions:
  - id: album-search-natural-token-expiration
    status: supported
    claim: Album search rejects a naturally expired Sonarfy access token with HTTP 401
    reason: Invalid-token checks alone do not demonstrate natural expiration of a normally issued login token
    verification: On 2026-11-24 the detached Postman run logged in with HTTP 200, confirmed a 900-second TTL, waited 15 minutes and received HTTP 401 for album search using that same token. Two requests and three assertions passed, with zero failures and exit code 0
    source: docs/api/sonarfy-album-search-expiration.postman_collection.json; docs/api/album-search.md
    updated_at: '2026-11-24'
  - id: album-search-live-postman-flow
    status: supported
    claim: The local Sonarfy HTTP flow can search Spotify with application credentials and publish and edit a review for an account without a personal Spotify connection
    reason: Provider-only searches and mocked tests do not establish the complete application flow with the real catalog
    verification: On 2026-11-24 the versioned live smoke collection passed 18 requests and 35 assertions using normal Sonarfy login, a dedicated PostgreSQL database and the real Spotify API. Search by album and artist, next page, empty filtered search, detail selection, create, reopen, duplicate preservation, edit and cleanup passed. SQL confirmed one test user, one selected album, zero Spotify connections, zero listens and zero remaining reviews. An arbitrary random query unexpectedly matched albums; explicit nonexistent album and artist filters exercised the empty state. Frontend and remote deployment were not tested
    source: docs/api/sonarfy-album-search-smoke.postman_collection.json; docs/api/album-search.md
    updated_at: '2026-11-24'
  - id: album-search-app-catalog
    status: supported
    claim: Application Client Credentials can search album and artist text with type album and market BR for the tested application
    reason: Orbit search metadata did not establish Client Credentials support; official Spotify documentation and a live probe supplied the missing evidence
    verification: On 2026-11-24 token issuance and searches for Random Access Memories and Daft Punk returned HTTP 200, two album objects and a next page indicator; secrets stayed in memory. This does not establish other markets, credentials or deployed availability
    source: https://developer.spotify.com/documentation/web-api/reference/search; https://developer.spotify.com/documentation/web-api/tutorials/client-credentials-flow; docs/api/album-search.md
    updated_at: '2026-11-24'
  - id: album-search-caller-errors
    status: supported
    claim: The search caller sanitizes modeled provider failures and searches without writing catalog data or requiring a personal Spotify connection
    reason: Search previews must remain independent of catalog persistence and personal authorization
    verification: On 2026-11-24 real controller and Feign passed Postman simulation cases for pagination, empty results, 401, 403, 404, 429 with Retry-After 900, 5xx, malformed JSON, incompatible metadata and timeout. Request events confirmed encoded query and fixed album type. Separate PostgreSQL HTTP tests passed search, detail resolution, publication and duplicate 409 with zero personal connections; two collection runs passed 25 assertions each
    source: src/test/java/br/com/pablohcarmo/sonarfy/services/AlbumSearchSimulationTest.java; src/test/java/br/com/pablohcarmo/sonarfy/services/AlbumDetailsPostgresTest.java; test-support/spotify-api/default.js
    updated_at: '2026-11-24'
  - id: spotify-retry-after-preservation
    status: supported
    claim: Spotify rate-limit responses provide Retry-After in seconds; the client preserves positive values without shortening them
    reason: Shortening the provider delay could cause callers to retry before the indicated time
    verification: On 2026-11-22, unit and real Feign HTTP simulation tests passed with Retry-After values of 45 and 900 seconds preserved
    source: https://developer.spotify.com/documentation/web-api/concepts/rate-limits
    updated_at: '2026-11-22'
  - id: spotify-partial-page-rate-limit
    status: supported
    claim: Rate limits may occur on later page requests and their Retry-After must not be shortened by the caller
    reason: Each page is an independent Web API request subject to rate limiting
    verification: On 2026-11-22, the real Feign client and secured sync HTTP chain against PostgreSQL and a synthetic second-page 429 preserved 50 listens, returned HTTP 200 with complete=false and Retry-After 900, persisted the delay and rejected an early retry with 429
    source: https://developer.spotify.com/documentation/web-api/concepts/rate-limits
    updated_at: '2026-11-22'
  - id: spotify-recently-played-contract
    status: supported
    claim: GET /v1/me/player/recently-played accepts limit (1..50), mutually exclusive before/after cursors, and returns PlayHistoryObject items
    reason: Supported by Spotify Web API reference; mock enforces limit bounds and rejects simultaneous after and before
    verification: SpotifyRecentlyPlayedSimulationTest performs real HTTP requests through Feign against the Postman simulation
    source: https://developer.spotify.com/documentation/web-api/reference/get-recently-played
    updated_at: '2026-11-21'
  - id: spotify-dev-mode-2026
    status: supported
    claim: Development mode apps return 403 for non-allowlisted users and omit popularity, available_markets, linked_from, label and album_group
    reason: Documented in Spotify Web API February/March 2026 updates; fixtures omit removed fields and test 403 handling
    verification: SpotifyRecentlyPlayedSimulationTest exercises 200 without removed fields and 403 forbidden translation
    source: https://developer.spotify.com/documentation/web-api/reference/get-recently-played
    updated_at: '2026-11-21'
  - id: reviews-on-imported-albums-after-disconnection
    status: supported
    claim: In the tested HTTP lifecycle, reviews of a locally imported album continued to work after disconnecting Spotify without further provider requests
    reason: Reviews resolve local album identity; provider access is needed for this synthetic import but is not a dependency of the subsequent review operations
    verification: On 2026-11-23, ran the real application JAR and disposable PostgreSQL with the existing Postman simulation. Sync imported one listen and album1; disconnection returned 204 and DISCONNECTED. The review collection passed 14 requests and 21 assertions, plus 34 supplementary HTTP checks. The simulation log did not change during reviews. The first script expectation of two imports was corrected to one, matching the fixture and short-page behavior. This covered feat/album-reviews working tree based on 066a41c, before three new origin/main commits; no live Spotify or OAuth validation
    source: docs/api/reviews.md; target/reviews-http-postman.log; target/reviews-http-result.json; target/reviews-http-simulation.log
    updated_at: '2026-11-23'
  - id: live-spotify-recently-played
    status: unknown
    claim: Live Spotify account returns expected recent listens within the ~50-item window and respects app allowlist
    reason: No real Spotify Web API calls were executed during this client delivery
    verification: Requires manual validation with a test account after sync endpoint delivery
    source: docs/integrations/spotify.md
    updated_at: '2026-11-21'
  - id: spotify-album-metadata
    status: supported
    claim: Album metadata exposes total_tracks independently of its embedded track page
    reason: Official Get Album reference defines total_tracks; the caller ignores the embedded page
    verification: On 2026-11-24, SpotifyAlbumSimulationTest used real Feign against the local Postman simulation and returned 70 tracks with an empty embedded track page, with and without market. The focused suite passed 13 tests; synthetic failures covered 401, 403, 404, 429 with Retry-After 900, 500, 503, invalid JSON, invalid metadata and timeout. Request events were observed in target/spotify-album-simulation.ndjson
    source: https://developer.spotify.com/documentation/web-api/reference/get-an-album; src/test/java/br/com/pablohcarmo/sonarfy/services/SpotifyAlbumSimulationTest.java
    updated_at: '2026-11-24'
  - id: live-spotify-album-access
    status: supported
    claim: The configured local application credential retrieved the tested public album metadata in market BR without a personal Spotify connection
    reason: After the initial synthetic-only checks, the compiled application was run against live Spotify using Client Credentials and an empty disposable database
    verification: On 2026-11-24, GET for album 4aawyAB9vmqN3uQ7FjRGTy returned 200 and persisted 18 total tracks with zero personal Spotify connections. The versioned Postman collection passed four requests and seven assertions against the real Sonarfy HTTP server. After restarting with unavailable local provider URLs, the same album returned 200 and identical JSON. This is evidence for the tested album, market and local app credentials only; other albums, markets and deployed configurations remain unverified. Temporary server, database and runtime JWT collection were removed; personal application table fingerprints remained unchanged
    source: docs/api/albums.md; target/album-live-result.json; target/album-live-postman.log
    updated_at: '2026-11-24'
  - id: album-catalog-local-enrichment
    status: supported
    claim: The catalog caller persists successful album metadata while preserving local album identity
    reason: The resolver uses the existing Spotify ID and commits artist and album in a separate database transaction after HTTP
    verification: On 2026-11-24, AlbumCatalogPostgresTest passed four tests with disposable PostgreSQL 17 and real Feign against Postman. It preserved a legacy album ID and review, resolved concurrent misses without duplicate artists or albums, skipped credential acquisition on a complete local hit, rolled back artist insertion after a database failure and reapplied migration 017 twice. No live Spotify calls or personal database changes
    source: src/test/java/br/com/pablohcarmo/sonarfy/services/AlbumCatalogPostgresTest.java; target/catalog-focused.log
    updated_at: '2026-11-24'
  - id: album-details-application-credentials
    status: supported
    claim: The album details endpoint can resolve metadata using application credentials without a personal Spotify connection
    reason: The caller uses Client Credentials and provides a market; complete local albums bypass token acquisition
    verification: On 2026-11-24, AlbumDetailsPostgresTest used a real HTTP server, Sonarfy Bearer security, disposable PostgreSQL and real Feign against the Postman simulation. The mock checked Basic auth and grant_type=client_credentials. Tests covered cache hits, eligible aggregates, 401/403/404/429/503 provider responses, rejected or invalid tokens and token invalidation. The versioned Postman collection passed four requests and seven assertions against the real server; no live Spotify interaction
    source: https://developer.spotify.com/documentation/web-api/tutorials/client-credentials-flow; src/test/java/br/com/pablohcarmo/sonarfy/services/AlbumDetailsPostgresTest.java; target/album-details-focused.log; target/albums-postman.log
    updated_at: '2026-11-24'
  - id: album-community-local-read
    status: supported
    claim: Reading the community for a known local album does not request metadata or application credentials from Spotify
    reason: The community query resolves local identity and filters reviews and eligible authors in PostgreSQL
    verification: On 2026-11-24, AlbumDetailsPostgresTest exercised four global sort orders with rating ties, keyset pages, context-bound cursors, deleted cursor boundaries, account eligibility, reactivation and forbidden third-party deletion through the real secured HTTP server. After community reads and local aggregates, the provider counters remained zero for both album requests and token issuance. The versioned Postman collection passed the empty scenario with 11 requests and 22 assertions and the populated scenario with 12 requests and 26 assertions; all fixtures stayed in disposable PostgreSQL
    source: src/test/java/br/com/pablohcarmo/sonarfy/services/AlbumDetailsPostgresTest.java; target/album-community-focused.log; target/albums-postman-empty.log; target/albums-postman-community.log
    updated_at: '2026-11-24'
