simulation: spotify-recently-played
generated: '2026-11-21'
purpose:
  stands_in_for: Spotify Web API GET /v1/me/player/recently-played with synthetic play history and error scenarios
  unblocks: HTTP client serialization, timeout, pagination and sanitized error handling without real credentials
assumptions:
  - id: spotify-retry-after-preservation
    status: supported
    claim: Spotify rate-limit responses provide Retry-After in seconds; the client preserves positive values without shortening them
    reason: Shortening the provider delay could cause callers to retry before the indicated time
    verification: On 2026-11-22, unit and real Feign HTTP simulation tests passed with Retry-After values of 45 and 900 seconds preserved
    source: https://developer.spotify.com/documentation/web-api/concepts/rate-limits
    updated_at: '2026-11-22'
  - id: spotify-partial-page-rate-limit
    status: supported
    claim: Rate limits may occur on later page requests and their Retry-After must not be shortened by the caller
    reason: Each page is an independent Web API request subject to rate limiting
    verification: On 2026-11-22, the real Feign client and secured sync HTTP chain against PostgreSQL and a synthetic second-page 429 preserved 50 listens, returned HTTP 200 with complete=false and Retry-After 900, persisted the delay and rejected an early retry with 429
    source: https://developer.spotify.com/documentation/web-api/concepts/rate-limits
    updated_at: '2026-11-22'
  - id: spotify-recently-played-contract
    status: supported
    claim: GET /v1/me/player/recently-played accepts limit (1..50), mutually exclusive before/after cursors, and returns PlayHistoryObject items
    reason: Supported by Spotify Web API reference; mock enforces limit bounds and rejects simultaneous after and before
    verification: SpotifyRecentlyPlayedSimulationTest performs real HTTP requests through Feign against the Postman simulation
    source: https://developer.spotify.com/documentation/web-api/reference/get-recently-played
    updated_at: '2026-11-21'
  - id: spotify-dev-mode-2026
    status: supported
    claim: Development mode apps return 403 for non-allowlisted users and omit popularity, available_markets, linked_from, label and album_group
    reason: Documented in Spotify Web API February/March 2026 updates; fixtures omit removed fields and test 403 handling
    verification: SpotifyRecentlyPlayedSimulationTest exercises 200 without removed fields and 403 forbidden translation
    source: https://developer.spotify.com/documentation/web-api/reference/get-recently-played
    updated_at: '2026-11-21'
  - id: reviews-on-imported-albums-after-disconnection
    status: supported
    claim: In the tested HTTP lifecycle, reviews of a locally imported album continued to work after disconnecting Spotify without further provider requests
    reason: Reviews resolve local album identity; provider access is needed for this synthetic import but is not a dependency of the subsequent review operations
    verification: On 2026-11-23, ran the real application JAR and disposable PostgreSQL with the existing Postman simulation. Sync imported one listen and album1; disconnection returned 204 and DISCONNECTED. The review collection passed 14 requests and 21 assertions, plus 34 supplementary HTTP checks. The simulation log did not change during reviews. The first script expectation of two imports was corrected to one, matching the fixture and short-page behavior. This covered feat/album-reviews working tree based on 066a41c, before three new origin/main commits; no live Spotify or OAuth validation
    source: docs/api/reviews.md; target/reviews-http-postman.log; target/reviews-http-result.json; target/reviews-http-simulation.log
    updated_at: '2026-11-23'
  - id: live-spotify-recently-played
    status: unknown
    claim: Live Spotify account returns expected recent listens within the ~50-item window and respects app allowlist
    reason: No real Spotify Web API calls were executed during this client delivery
    verification: Requires manual validation with a test account after sync endpoint delivery
    source: docs/integrations/spotify.md
    updated_at: '2026-11-21'
  - id: spotify-album-metadata
    status: supported
    claim: Album metadata exposes total_tracks independently of its embedded track page
    reason: Official Get Album reference defines total_tracks; the caller ignores the embedded page
    verification: On 2026-11-24, SpotifyAlbumSimulationTest used real Feign against the local Postman simulation and returned 70 tracks with an empty embedded track page, with and without market. The focused suite passed 13 tests; synthetic failures covered 401, 403, 404, 429 with Retry-After 900, 500, 503, invalid JSON, invalid metadata and timeout. Request events were observed in target/spotify-album-simulation.ndjson
    source: https://developer.spotify.com/documentation/web-api/reference/get-an-album; src/test/java/br/com/pablohcarmo/sonarfy/services/SpotifyAlbumSimulationTest.java
    updated_at: '2026-11-24'
  - id: live-spotify-album-access
    status: unknown
    claim: The deployed application credential can retrieve album metadata in the selected market
    reason: This delivery receives a token from its caller and was validated only against synthetic HTTP responses
    verification: No live Spotify calls or credential acquisition were exercised; integrate credential acquisition and validate availability in the catalog delivery
    source: docs/api/albums.md
    updated_at: '2026-11-24'
  - id: album-catalog-local-enrichment
    status: supported
    claim: The catalog caller persists successful album metadata while preserving local album identity
    reason: The resolver uses the existing Spotify ID and commits artist and album in a separate database transaction after HTTP
    verification: On 2026-11-24, AlbumCatalogPostgresTest passed four tests with disposable PostgreSQL 17 and real Feign against Postman. It preserved a legacy album ID and review, resolved concurrent misses without duplicate artists or albums, skipped credential acquisition on a complete local hit, rolled back artist insertion after a database failure and reapplied migration 017 twice. No live Spotify calls or personal database changes
    source: src/test/java/br/com/pablohcarmo/sonarfy/services/AlbumCatalogPostgresTest.java; target/catalog-focused.log
    updated_at: '2026-11-24'
